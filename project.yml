name: ArenaAIChat
options:
  bundleIdPrefix: com.arenaai
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  ArenaAIChat:
    type: application
    platform: iOS
    sources:
      - path: ArenaAIChat/ArenaAIChatApp.swift
      - path: ArenaAIChat/index.html
        buildPhase: resources
      - path: ArenaAIChat/Assets.xcassets
    info:
      path: ArenaAIChat/Info.plist
      properties:
        NSMicrophoneUsageDescription: "ArenaAI uses the microphone for voice input."
        NSSpeechRecognitionUsageDescription: "ArenaAI uses speech recognition to transcribe voice messages."
        NSCameraUsageDescription: "ArenaAI uses the camera to capture images for chat."
        NSPhotoLibraryUsageDescription: "ArenaAI accesses your photos to attach images to chat."
        UIFileSharingEnabled: true
        UISupportsDocumentBrowser: true
    settings:
      base:
        PRODUCT_NAME: ArenaAIChat
        PRODUCT_BUNDLE_IDENTIFIER: com.arenaai.chat
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
