name: ArenaAIChat
options:
  bundleIdPrefix: com.arenaai
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  ArenaAIChat:
    type: application
    platform: iOS
    sources:
      - path: ArenaAIChat/ArenaAIChatApp.swift
      - path: ArenaAIChat/index.html
        buildPhase: resources
      - path: ArenaAIChat/Assets.xcassets
    info:
      path: ArenaAIChat/Info.plist
    settings:
      base:
        PRODUCT_NAME: ArenaAIChat
        PRODUCT_BUNDLE_IDENTIFIER: com.arenaai.chat
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
